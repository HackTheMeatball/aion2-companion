<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Asmodian Assassin Route</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#110c13">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Figtree:wght@400;600&family=JetBrains+Mono:wght@600&display=swap">
<style>
:root { --bg: #110c13; --panel: #1a1320; --line: #33263c; --fg: #ece4ee; --muted: #9f90a8; --accent: #d0506f;
  --display: "Marcellus SC", "Palatino Linotype", Georgia, serif; --body: "Figtree", "Segoe UI", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, Consolas, monospace; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); background-image: radial-gradient(1200px 500px at 85% -10%, #3a1730 0%, transparent 60%), radial-gradient(900px 400px at -10% 110%, #221a3d 0%, transparent 60%);
  background-attachment: fixed; color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.55; display: grid; place-items: center; min-height: 100vh; padding: 16px; }
.card { max-width: 440px; width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 28px 24px; }
.eyebrow { font: 600 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin: 0 0 6px; }
h1 { font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1.15; margin: 0 0 10px; }
p { margin: 0 0 18px; color: var(--muted); }
a.btn { display: inline-block; font: 600 13px var(--mono); padding: 8px 14px; border-radius: 8px; border: 1px solid var(--accent); color: var(--fg); text-decoration: none; }
a.btn:hover, a.btn:focus-visible { background: #d0506f26; }
</style>
</head>
<body>
<main class="card">
  <p class="eyebrow">404</p>
  <h1>Off the route</h1>
  <p>There's no page at this address. Your progress is safe: it lives in this browser and the guide is one click away.</p>
  <a class="btn" href="/">Back to the route</a>
</main>
</body>
</html>
