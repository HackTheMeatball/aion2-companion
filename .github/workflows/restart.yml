name: Restart

# Owner request (2026-10-16, "everything stays productive"): a bot run that dies mid-job (runner lost, timeout,
# usage cap, a crash in the action) used to sit dead until the hourly CEO planner noticed it. This re-runs the failed
# or cancelled jobs of a Claude, Pipeline or Kickoff run once, at once, with no model:
#   - Pipeline fix/review: the re-run re-checks the head first. If the dead run had already pushed, the new head's CI
#     drives the next step instead (and the re-run skips); otherwise it starts again on the branch as it stands. A re-run
#     reuses the fix-round marker of attempt 1, so a dead run costs no extra round.
#   - Kickoff build: the build prompt continues an existing claude/issue-N-<run id> branch (the id is the same on a
#     re-run) instead of starting over.
#   - Claude (@claude/@sonnet): claude-code-action runs the same comment again.
# Only attempt 1 is re-run, so each run gets at most one automatic restart; a second death is left to the planner.
# A run started with GITHUB_TOKEN sends no workflow_run event (Kickoff started by ci.yml, CI on main started by
# auto-merge), so the schedule also looks every 15 min for an attempt-1 Kickoff or main CI run that ended badly in the
# last 90 min. A main CI re-run that passes then starts Kickoff. It also brings main into claude/ PRs that conflict.

on:
  workflow_run:
    workflows: [Claude, Pipeline, Kickoff]
    types: [completed]
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

jobs:
  restart:
    if: |
      github.event_name == 'schedule' ||
      github.event.workflow_run.run_attempt == 1 &&
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled' ||
       github.event.workflow_run.conclusion == 'timed_out')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      pull-requests: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const BAD = ['failure', 'cancelled', 'timed_out'];
            const recent = async (q) => (await github.rest.actions.listWorkflowRuns({ owner, repo, status: 'completed', per_page: 30, ...q })).data.workflow_runs
              // Not "cancelled": a Kickoff pick job dropped while pending (concurrency) ends that way and needs no re-run.
              .filter((r) => r.run_attempt === 1 && ['failure', 'timed_out'].includes(r.conclusion) && Date.now() - Date.parse(r.updated_at) < 90 * 60e3);
            const runs = context.eventName === 'schedule'
              ? [...await recent({ workflow_id: 'kickoff.yml' }), ...await recent({ workflow_id: 'ci.yml', branch: 'main' })]
              : [context.payload.workflow_run];
            for (const wr of runs) {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, { owner, repo, run_id: wr.id, per_page: 100 });
              const dead = jobs.filter((j) => BAD.includes(j.conclusion)).map((j) => j.name);
              if (!dead.length) { core.info(`${wr.name} run ${wr.id}: no failed job to re-run`); continue; }
              try { await github.rest.actions.reRunWorkflowFailedJobs({ owner, repo, run_id: wr.id }); }
              catch (e) { core.warning(`${wr.name} run ${wr.id}: re-run failed: ${e.message}`); continue; }
              core.notice(`re-running ${dead.join(', ')} of ${wr.name} run ${wr.html_url} (attempt 2 of 2)`);
            }
            // A claude/ PR that conflicts with main gets no CI (GitHub runs none on a conflicting PR), so nothing ever
            // wakes for it. Kickoff's refresh only sees PRs open at merge time: P4b's PR #177 opened 8 min after the
            // merge it conflicted with and had no CI until someone noticed (2026-10-17). Start pipeline step=merge for it; pipeline runs at most
            // one merge per PR per main commit, so this repeats nothing.
            if (context.eventName === 'schedule') {
              const open = (await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', base: 'main', per_page: 100 }))
                .filter((p) => !p.draft && /^claude\//.test(p.head.ref) && !p.labels.some((l) => ['hold', 'stuck'].includes(l.name)));
              for (const p of open) {
                const pr = (await github.rest.pulls.get({ owner, repo, pull_number: p.number })).data;
                if (pr.mergeable_state !== 'dirty') continue;
                await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: 'pipeline.yml', ref: 'main', inputs: { pr: String(p.number), step: 'merge' } });
                core.notice(`#${p.number} conflicts with main: started pipeline step=merge`);
              }
            }
