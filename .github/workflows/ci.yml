name: CI

on:
  # Branch pushes run CI through their pull request only (no duplicate run per push); main runs on every push (deploy).
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch / PR. A newer push cancels an older run, except on main, where runs queue so a deploy is never cut off.
# Deploys are also serialized on their own "pages" group below.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Runner pinned (not ubuntu-latest) so an image change can't silently change test results; move it on purpose.
# Blocking jobs: data + every browser shard. ci-ok sums them up (the one required check); deploy needs it.
jobs:
  # Fast feedback on data and code (target < 2 min, no browser): JSON Schema validation of every v2 data file (ajv,
  # strict), the generator's cross-record checks, data/DATA_SOURCES.md current, the pure core in Node, the CHANGELOG
  # format, the CI shard list, and a build.
  data:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Data format v2 (schemas, cross-record checks, DATA_SOURCES.md)
        run: node tests/schema.mjs
      - name: Generated data is current
        run: npm run gen:check
      - name: Pure core (Node)
        run: npm run test:core
      - name: CHANGELOG has an entry for this version
        run: node scripts/release-notes.mjs > /dev/null
      - name: Every blocking suite is in exactly one browser shard
        run: node tests/run.mjs --check-shards
      - name: Build both deliverables
        run: npm run build

  # The browser suites of tests/run.mjs, one job per shard (SHARDS in tests/run.mjs; the data job checks this list
  # matches). fail-fast off, so every shard reports.
  browser:
    name: browser (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [journey, regress, golden, checks]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node tests/run.mjs --shard ${{ matrix.shard }}
      - name: Upload test output (logs, results.json, screenshots)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-output-${{ matrix.shard }}
          path: tests/out/
          retention-days: 7
          if-no-files-found: ignore

  # Non-blocking: update() < 15 ms (tests/perf.js). Wall-clock timing on a shared runner flakes, so a slow run is a
  # ::warning annotation, never a red check. Not in ci-ok; deploy doesn't wait for it.
  perf:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - id: perf
        continue-on-error: true
        run: node tests/run.mjs --only perf --retries 0
      - name: Report
        if: always()
        run: |
          f=tests/out/perf/results.json
          if [ -f "$f" ]; then
            node -e 'const r=require("./"+process.argv[1]),s=r.map(x=>x.ms).sort((a,b)=>a-b),bad=r.filter(x=>!x.pass);console.log(`::notice title=perf::update() over ${r.length} states: median ${s[s.length>>1]} ms, max ${s[s.length-1]} ms`);for(const x of bad)console.log(`::warning title=perf (non-blocking)::${x.name}: ${x.ms} ms`)' "$f"
          fi
          if [ "${{ steps.perf.outcome }}" != "success" ]; then echo "::warning title=perf (non-blocking)::tests/perf.js failed (see the warnings above, or tests/out/perf.out); ci-ok does not depend on it."; fi
      - name: Upload perf output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-output-perf
          path: tests/out/
          retention-days: 7
          if-no-files-found: ignore

  # The one required check (branch protection on main requires `ci-ok`). Runs even when a needed job failed or was
  # cancelled (if: always()) and fails unless every blocking job succeeded; a skipped blocking job counts as a failure.
  ci-ok:
    if: always()
    needs: [data, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: All blocking jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const n = JSON.parse(process.env.RESULTS), bad = Object.entries(n).filter(([, v]) => v.result !== "success");
            for (const [k, v] of Object.entries(n)) console.log(`${k}: ${v.result}`);
            if (!Object.keys(n).length) { console.log("::error title=ci-ok::no blocking jobs"); process.exit(1); }
            for (const [k, v] of bad) console.log(`::error title=ci-ok::${k} ${v.result}`);
            process.exit(bad.length ? 1 : 0);'

  deploy:
    needs: [data, browser, ci-ok]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    outputs:
      build_json: ${{ steps.build.outputs.build_json }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v6
      # The build needs devDependencies (esbuild) since 0.2 step 2; browsers aren't needed to build.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Build
        id: build
        # build.json (one line of JSON) goes to the smoke job, which waits for the live site to serve it.
        run: |
          npm run build
          echo "build_json=$(tr -d '\n' < dist/build.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/
      - id: deployment
        uses: actions/deploy-pages@v5

  # The live site must serve what deploy just built: polls /build.json (cache-busted, up to 5 min) until it equals
  # deploy's dist/build.json, then checks the footer shows package.json's version. A deploy that "succeeds" but never
  # goes live fails here, before a release is tagged. Failures are ::error annotations.
  smoke:
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Live site serves the deployed build and version
        env:
          EXPECTED_BUILD: ${{ needs.deploy.outputs.build_json }}
        run: node scripts/smoke.mjs --url https://daevacompanion.com --expect "$EXPECTED_BUILD" --timeout 300 --interval 10

  # A new version in package.json gets its tag and GitHub Release once it is tested and live (smoke passed). Notes come
  # from its CHANGELOG section. Versions already tagged are skipped, so ordinary pushes to main do nothing here.
  release:
    needs: [deploy, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Tag and publish new CHANGELOG versions; keep existing release notes in sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Each version is released at the first commit that set it in package.json (the current version at HEAD).
          cur="$(node -p 'require("./package.json").version')"
          for ver in $(node scripts/release-notes.mjs --list); do
            tag="v$ver"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              # Released already: keep its title and notes in sync with CHANGELOG.md (edits only when they differ).
              node scripts/release-notes.mjs --version "$ver" > notes.md
              title="$(node scripts/release-notes.mjs --version "$ver" --title)"
              have_title="$(gh release view "$tag" --json name -q .name 2>/dev/null || true)"
              have_body="$(gh release view "$tag" --json body -q .body 2>/dev/null || true)"
              if [ "$have_title" != "$title" ] || [ "$(printf '%s' "$have_body" | tr -d '\r')" != "$(cat notes.md)" ]; then
                if out="$(gh release edit "$tag" --title "$title" --notes-file notes.md 2>&1)"; then
                  echo "::notice title=Updated $tag notes::$title"
                else
                  echo "::warning title=Could not update $tag notes::$(echo "$out" | tr '\n' ' ')"
                fi
              fi
              continue
            fi
            if [ "$ver" = "$cur" ]; then sha="$GITHUB_SHA"; else
              sha="$(git log --reverse --format=%H -G"\"version\": \"$ver\"" -- package.json | head -1)"
            fi
            if [ -z "$sha" ]; then echo "::warning::No commit sets version $ver in package.json; not releasing it."; continue; fi
            node scripts/release-notes.mjs --version "$ver" > notes.md
            latest=false; [ "$ver" = "$cur" ] && latest=true
            # Failures are reported as annotations (readable without log access) with gh's own message.
            # A backfill (older version) only warns: GITHUB_TOKEN may not create a tag on a commit whose workflow files
            # differ from the current ones, so those need a one-time tag by a person. The current version must succeed.
            if ! out="$(gh release create "$tag" --target "$sha" \
                --title "$(node scripts/release-notes.mjs --version "$ver" --title)" \
                --notes-file notes.md --latest="$latest" 2>&1)"; then
              msg="$(echo "$out" | tr '\n' ' ')"
              if [ "$ver" = "$cur" ]; then echo "::error title=Release $tag failed::$msg"; exit 1; fi
              echo "::warning title=Backfill release $tag skipped::$msg"
              continue
            fi
            echo "::notice title=Released $tag::$out"
          done
