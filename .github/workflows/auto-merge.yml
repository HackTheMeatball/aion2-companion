name: Auto-merge

# Added by the owner (2026-10-16): merge a bot PR once it is green and reviewed, so the pipeline runs while he is away.
# A PR qualifies only when ALL of these hold:
#   - it comes from a claude/ branch in this repo, targets main, is open, not a draft, and has no "hold" label;
#   - the required check ci-ok succeeded on its current head commit;
#   - the latest claude[bot] review comment says "VERDICT: APPROVE" and was written after the head commit.
# It squash-merges pinned to that head commit, then starts CI on main so deploy, smoke and release run
# (a merge made by this workflow does not fire the normal push trigger).
# Pause it for one PR: add the label "hold". Stop it: Actions tab -> Auto-merge -> "..." -> Disable workflow.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read

concurrency:
  group: auto-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const prs = (await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', base: 'main', per_page: 100 }))
              .filter((p) => !p.draft && p.head.repo && p.head.repo.full_name === `${owner}/${repo}` && /^claude\//.test(p.head.ref)
                && !p.labels.some((l) => l.name === 'hold'));
            let merged = 0;
            const failed = [];
            for (const pr of prs) {
              const sha = pr.head.sha;
              const runs = (await github.rest.checks.listForRef({ owner, repo, ref: sha, check_name: 'ci-ok', per_page: 50 })).data.check_runs;
              if (!runs.some((r) => r.status === 'completed' && r.conclusion === 'success')) { core.info(`#${pr.number}: ci-ok not green`); continue; }
              const commit = (await github.rest.repos.getCommit({ owner, repo, ref: sha })).data;
              const headAt = Date.parse(commit.commit.committer.date);
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number, per_page: 100 });
              const reviews = comments.filter((c) => c.user && c.user.login === 'claude[bot]' && /VERDICT:\s*(APPROVE|CHANGES)/.test(c.body || ''))
                .sort((a, b) => Date.parse(a.updated_at) - Date.parse(b.updated_at));
              const last = reviews[reviews.length - 1];
              if (!last || !/VERDICT:\s*APPROVE/.test(last.body) || /VERDICT:\s*CHANGES/.test(last.body)) { core.info(`#${pr.number}: no approving review`); continue; }
              if (Date.parse(last.updated_at) < headAt) { core.info(`#${pr.number}: approval older than the head commit`); continue; }
              try {
                await github.rest.pulls.merge({ owner, repo, pull_number: pr.number, sha, merge_method: 'squash' });
                core.notice(`Merged #${pr.number}`); merged++;
              } catch (e) { core.error(`#${pr.number}: merge failed: ${e.message}`); failed.push(`#${pr.number}: ${e.message}`); }
            }
            if (merged) await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: 'ci.yml', ref: 'main' });
            // A ready PR that could not be merged turns this run red, so it shows up in the Actions list (before: a warning, run stayed green).
            if (failed.length) core.setFailed(`Ready PR(s) not merged: ${failed.join(' | ')}`);
      # A CI run on main that fails is re-run once (failed jobs only), so one flaky job doesn't leave main undeployed until someone looks.
      - name: Re-run failed main CI once
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.run_attempt == 1
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            await github.rest.actions.reRunWorkflowFailedJobs({ owner, repo, run_id: context.payload.workflow_run.id });
            core.notice(`Re-running failed jobs of CI run ${context.payload.workflow_run.id} on main (attempt 1 failed).`);
