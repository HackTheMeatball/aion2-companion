name: Claude

# @claude in an issue or PR comment (or a new issue) starts a Claude Code run on GitHub's runners, signed in with the
# owner's Claude subscription (secret CLAUDE_CODE_OAUTH_TOKEN). Docs: https://code.claude.com/docs/en/github-actions
# Two trigger words: @claude runs Opus (code, saves, hard reviews); @sonnet runs Sonnet (docs, research, data checks,
# simple reviews) to save usage; a comment naming both runs Opus only. Only the owner's account can start a run: the repo is public, and the action also requires write access.
# On an issue Claude works on a new branch (prefix claude/) and links a prefilled PR; on an open PR it pushes to that
# PR's branch. It cannot merge, approve or rebase. CLAUDE.md applies to every run.
# Push CI (ci.yml) runs only on main: a claude/ branch pushed from an issue gets CI once its PR is opened (or by hand:
# Actions → CI → Run workflow).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  claude:
    if: |
      github.actor == 'HackTheMeatball' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    # One run at a time per issue / PR; a new @claude on the same thread waits instead of racing the running one.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      # Same toolchain as CI, so Claude can build and run the test suites (Chromium for the browser suites).
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-opus-5-5
            --max-turns 400
            --allowedTools "Bash(npm:*),Bash(node:*),Bash(git:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(grep:*),Bash(rg:*),Bash(wc:*),Bash(diff:*),Bash(sort:*),Bash(mkdir:*),Bash(cp:*),Bash(mv:*),Edit,Write,Read,Glob,Grep,WebFetch,WebSearch"

  sonnet:
    if: |
      github.actor == 'HackTheMeatball' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@sonnet') && !contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@sonnet') && !contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@sonnet') && !contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@sonnet') || contains(github.event.issue.title, '@sonnet')) && !contains(github.event.issue.body, '@claude') && !contains(github.event.issue.title, '@claude'))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    # One run at a time per issue / PR; a new @sonnet on the same thread waits instead of racing the running one.
    concurrency:
      group: sonnet-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      # Same toolchain as CI, so Claude can build and run the test suites (Chromium for the browser suites).
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: anthropics/claude-code-action@v1
        with:
          trigger_phrase: "@sonnet"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 400
            --append-system-prompt "ROUTING GUARD (owner rule, 2026-10-15): this is the Sonnet run, for reviews, docs, research and small data fixes only. Before editing anything, check whether your own edits would touch any of these: src/core/**; save, sync, migration or storage code in src/main.js; the requires or completesWith fields of anything under data/; tests/golden snapshots (--record) or the mig1 pin; or total more than about 300 changed lines. If they would, do not edit. Post one comment that starts with 'Needs @claude (Opus):' and gives the reason in one line, then stop. Reviewing such changes, without editing them, is fine."
            --allowedTools "Bash(npm:*),Bash(node:*),Bash(git:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(grep:*),Bash(rg:*),Bash(wc:*),Bash(diff:*),Bash(sort:*),Bash(mkdir:*),Bash(cp:*),Bash(mv:*),Edit,Write,Read,Glob,Grep,WebFetch,WebSearch"
