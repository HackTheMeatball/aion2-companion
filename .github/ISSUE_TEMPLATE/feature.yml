name: Idea
description: Suggest something the guide could do or show.
title: "Idea: "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        **Issues are public.** Don't include personal details.
        Planned work is in [ROADMAP.md](https://github.com/hackthemeatball/aion2-companion/blob/main/ROADMAP.md).
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What you'd like the guide to do, and the situation in game where you'd use it.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What does it solve?
      description: What's hard or missing today.
    validations:
      required: false
