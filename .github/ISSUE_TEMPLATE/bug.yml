name: Report a problem
description: Something in the guide looks wrong, is broken or is confusing.
title: "Problem: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Issues are public.** Don't include personal details (real name, email, account or character names you want kept private).
        The **Report a problem** link in the app fills in the version, level, story quest, mode, build and browser below; nothing else from your saved progress is sent. Edit or delete anything you don't want to share.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and where (which card, milestone or step). A screenshot helps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: If the game shows something different, say what it shows.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown at the bottom of the page (for example v0.1.4).
      placeholder: v0.1.4
    validations:
      required: false
  - type: input
    id: level
    attributes:
      label: Level in the guide
    validations:
      required: false
  - type: input
    id: quest
    attributes:
      label: Current story quest in the guide
    validations:
      required: false
  - type: input
    id: mode
    attributes:
      label: Mode
      description: Basic or Advanced
    validations:
      required: false
  - type: input
    id: build
    attributes:
      label: Build
      description: "\"site\" (daevacompanion.com) or \"claude.ai\""
    validations:
      required: false
  - type: input
    id: browser
    attributes:
      label: Browser
      description: The browser's user agent (filled in by the app) or the browser and device you use.
    validations:
      required: false
